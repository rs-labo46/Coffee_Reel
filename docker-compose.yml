services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["go", "run", "./cmd/migrate"]
    environment:
      DATABASE_URL: "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=UTC"
    depends_on:
      db:
        condition: service_healthy

  create-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["go", "run", "./cmd/create_admin"]
    restart: "no"
    environment:
      DATABASE_URL: "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=UTC"

      JWT_SECRET: "${JWT_SECRET}"
      REFRESH_TOKEN_HMAC_KEY: "${REFRESH_TOKEN_HMAC_KEY}"

      ADMIN_NAME: "${ADMIN_NAME}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7
    restart: always
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command:
      [
        "/bin/sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
      ]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: "${PORT}"

      DATABASE_URL: "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=UTC"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB}"

      FE_URL: "${FE_URL}"

      COOKIE_SECURE: "${COOKIE_SECURE}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN}"

      JWT_SECRET: "${JWT_SECRET}"
      REFRESH_TOKEN_HMAC_KEY: "${REFRESH_TOKEN_HMAC_KEY}"
      RATE_LIMIT_HMAC_KEY: "${RATE_LIMIT_HMAC_KEY}"

    ports:
      - "${PORT}:${PORT}"
    depends_on:
      create-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      VITE_API_URL: "${VITE_API_URL}"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FE_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
