name: CI

"on":
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify modules
        working-directory: backend
        run: go mod verify

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -count=1 ./...

      - name: Build
        working-directory: backend
        run: go build ./...

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coffee_reel
          POSTGRES_PASSWORD: coffee_reel_test
          POSTGRES_DB: coffee_reel_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U coffee_reel -d coffee_reel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: "host=127.0.0.1 user=coffee_reel password=coffee_reel_test dbname=coffee_reel_test port=5432 sslmode=disable TimeZone=Asia/Tokyo"
      TEST_REDIS_ADDR: "127.0.0.1:6379"
      TEST_REDIS_DB: "15"
      TEST_REDIS_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run integration tests
        working-directory: backend
        run: go test -tags=integration -count=1 ./repository

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - backend
      - backend-integration
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend API image
        run: docker build --target api -t coffee-reel-backend-ci ./backend

      - name: Build worker image
        run: docker build --target worker -t coffee-reel-worker-ci ./backend

      - name: Build frontend image
        run: docker build -t coffee-reel-frontend-ci ./frontend
